name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      workspace_path:
        description: "Optional path to the .xcworkspace (relative to the repository root)"
        required: false
        type: string
      project_path:
        description: "Optional path to the .xcodeproj (relative to the repository root)"
        required: false
        type: string
      scheme:
        description: "Optional Xcode scheme; the first shared scheme is used when blank"
        required: false
        type: string
      configuration:
        description: "Xcode configuration"
        required: false
        default: Release
        type: string
  push:
    branches: [main]
    paths:
      - "**/*.xcodeproj/**"
      - "**/*.xcworkspace/**"
      - "**/*.swift"
      - "**/*.m"
      - "**/*.mm"
      - "Package.swift"
      - "Package.resolved"
      - "project.yml"
      - "Resources/**"
      - "scripts/build_ipa.sh"

permissions:
  contents: read

jobs:
  build:
    name: Archive and package IPA
    runs-on: macos-15
    timeout-minutes: 30
    env:
      WORKSPACE_PATH: ${{ inputs.workspace_path }}
      PROJECT_PATH: ${{ inputs.project_path }}
      SCHEME: ${{ inputs.scheme }}
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          xcode_app="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          if [[ -z "$xcode_app" ]]; then
            echo "::error::Xcode 26 is required for the iOS 26 deployment target."
            exit 1
          fi
          developer_dir="$xcode_app/Contents/Developer"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          sudo xcode-select -s "$developer_dir"

      - name: Show toolchain
        run: xcodebuild -version

      - name: Generate Xcode project
        shell: bash
        run: |
          if [[ ! -f project.yml ]]; then
            exit 0
          fi
          if find . -maxdepth 5 -type d \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) -print -quit | grep -q .; then
            echo "An Xcode project/workspace is already present; skipping XcodeGen."
            exit 0
          fi
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate --spec project.yml

      - name: Build unsigned IPA
        shell: bash
        run: bash scripts/build_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Photo-Cleanz-IPA-${{ github.run_number }}
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14
